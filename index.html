<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEMA — Расписание сеансов</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">🎬 CINEMA</h1>
            <nav class="nav">
                <a href="#schedule">Сеансы</a>
                <a href="#movies">Фильмы</a>
                <a href="#popular">Популярное</a>
                <a href="#search">Поиск</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h2>Добро пожаловать в мир кино</h2>
            <p>Лучшие фильмы, уютные залы, доступные цены</p>
        </div>
    </section>

    <main class="container">
        <!-- СЕАНСЫ НА СЕГОДНЯ -->
        <section id="schedule" class="section">
            <h2 class="section-title">📅 Сеансы на сегодня</h2>
            <div id="schedule-container" class="schedule-grid">Загрузка...</div>
        </section>

        <!-- ВСЕ ФИЛЬМЫ -->
        <section id="movies" class="section">
            <h2 class="section-title">🎥 В прокате</h2>
            <div class="search-bar">
                <input type="text" id="genre-input" placeholder="Поиск по жанру (Фантастика, Боевик...)" oninput="searchByGenre()">
            </div>
            <div id="movies-container" class="movies-grid">Загрузка...</div>
        </section>

        <!-- ПОПУЛЯРНЫЕ -->
        <section id="popular" class="section">
            <h2 class="section-title">⭐ Топ по рейтингу</h2>
            <div id="popular-container" class="movies-grid">Загрузка...</div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 CINEMA. Все права защищены.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
